name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Import every module
        run: uv run python -c "import printermonitor.server, printermonitor.mcp_server, printermonitor.go2rtc; print('go2rtc asset:', printermonitor.go2rtc.release_asset())"
      - name: Start the app and query the API
        shell: bash
        env:
          PM_DATA_DIR: ${{ runner.temp }}/pm-data
          PM_SCAN_SUBNET: 127.0.0.1/32
          PM_PORT: "8765"
        run: |
          uv run printermonitor &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/printers && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/ > /dev/null
      - run: uv build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for f in src/printermonitor/static/*.js; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t creality-printer-monitor .
